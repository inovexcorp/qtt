# QTT configuration. Every value can be overridden with an environment variable; the ${ENV_VAR:default}
# names are unchanged from the Karaf distribution (etc/*.cfg), so existing deployments keep working.

# ---------------------------------------------------------------- HTTP: UI and management API
# The UI and REST API listen on 8443 (TLS) and 8080 (plain), as under Karaf/Pax Web.
quarkus.http.port=8080
quarkus.http.ssl-port=8443
quarkus.http.insecure-requests=enabled
quarkus.http.ssl.certificate.key-store-file=${KEYSTORE:etc/keystore}
quarkus.http.ssl.certificate.key-store-password=${PASSWORD:p@ssword1}
quarkus.http.ssl.certificate.key-store-file-type=JKS
quarkus.rest.path=/queryrest
# Route templates arrive as multipart form fields; allow large ones.
quarkus.http.limits.max-form-attribute-size=16M
quarkus.http.limits.max-body-size=32M

# Karaf's JSON provider wrote java.util.Date values as epoch milliseconds; the UI relies on that.
quarkus.jackson.write-dates-as-timestamps=true

# ---------------------------------------------------------------- Camel
camel.context.name=query-service-route-builder
# Every QTT route is built at runtime from the database; there are no static RouteBuilders to discover.
quarkus.camel.routes-discovery.enabled=false
quarkus.camel.service.discovery.include-patterns=META-INF/services/org/apache/camel/component/anzo
# Route metrics are read from Camel's JMX MBeans.
camel.main.jmxEnabled=true

# ---------------------------------------------------------------- Database
# One persistence unit per supported database; DatabaseKindConfigSource activates the one matching DB_URL.
# The Derby unit is defined by the query-service-derby module (META-INF/microprofile-config.properties), which
# native builds leave out.
qtt.db.url=${DB_URL:jdbc:derby:data/database;create=true}

quarkus.datasource.postgresql.db-kind=postgresql
quarkus.datasource.postgresql.jdbc.url=${qtt.db.url}
quarkus.datasource.postgresql.username=${DB_USER:user}
quarkus.datasource.postgresql.password=${DB_PASSWORD:password}
quarkus.datasource.postgresql.jdbc.max-size=10
quarkus.hibernate-orm.postgresql.datasource=postgresql
quarkus.hibernate-orm.postgresql.packages=com.inovexcorp.queryservice.persistence
quarkus.hibernate-orm.postgresql.schema-management.strategy=update
quarkus.hibernate-orm.postgresql.unsupported-properties."hibernate.jdbc.lob.non_contextual_creation"=true

quarkus.datasource.mssql.db-kind=mssql
quarkus.datasource.mssql.jdbc.url=${qtt.db.url}
quarkus.datasource.mssql.username=${DB_USER:user}
quarkus.datasource.mssql.password=${DB_PASSWORD:password}
quarkus.datasource.mssql.jdbc.max-size=10
quarkus.hibernate-orm.mssql.datasource=mssql
quarkus.hibernate-orm.mssql.packages=com.inovexcorp.queryservice.persistence
quarkus.hibernate-orm.mssql.schema-management.strategy=update

quarkus.devservices.enabled=false

# ---------------------------------------------------------------- Logging
quarkus.log.level=INFO
quarkus.log.category."org.hibernate".level=WARN
quarkus.log.category."org.apache.camel.impl.engine".level=WARN

# ---------------------------------------------------------------- QTT components
# --- cache (formerly etc/com.inovexcorp.queryservice.cache.cfg)
com.inovexcorp.queryservice.cache.redis.enabled=${REDIS_ENABLED:false}
com.inovexcorp.queryservice.cache.redis.host=${REDIS_HOST:localhost}
com.inovexcorp.queryservice.cache.redis.port=${REDIS_PORT:6379}
com.inovexcorp.queryservice.cache.redis.password=${REDIS_PASSWORD:}
com.inovexcorp.queryservice.cache.redis.database=${REDIS_DATABASE:0}
com.inovexcorp.queryservice.cache.redis.timeout=${REDIS_TIMEOUT:5000}
com.inovexcorp.queryservice.cache.redis.pool.maxTotal=${REDIS_POOL_MAX_TOTAL:20}
com.inovexcorp.queryservice.cache.redis.pool.maxIdle=${REDIS_POOL_MAX_IDLE:10}
com.inovexcorp.queryservice.cache.redis.pool.minIdle=${REDIS_POOL_MIN_IDLE:5}
com.inovexcorp.queryservice.cache.cache.keyPrefix=${CACHE_KEY_PREFIX:qtt:cache:}
com.inovexcorp.queryservice.cache.cache.defaultTtlSeconds=${CACHE_DEFAULT_TTL:3600}
com.inovexcorp.queryservice.cache.cache.compressionEnabled=${CACHE_COMPRESSION_ENABLED:true}
com.inovexcorp.queryservice.cache.cache.failOpen=${CACHE_FAIL_OPEN:true}
com.inovexcorp.queryservice.cache.cache.statsEnabled=${CACHE_STATS_ENABLED:true}
com.inovexcorp.queryservice.cache.cache.statsTtlSeconds=${CACHE_STATS_TTL:5}
com.inovexcorp.queryservice.cache.cache.coalescingEnabled=${CACHE_COALESCING_ENABLED:true}
com.inovexcorp.queryservice.cache.cache.coalescingTimeoutMs=${CACHE_COALESCING_TIMEOUT_MS:30000}

# --- jsonldSerializer (formerly etc/com.inovexcorp.queryservice.jsonldSerializer.cfg)
com.inovexcorp.queryservice.jsonldSerializer.baseUri=https://realmone.com/query-service/
com.inovexcorp.queryservice.jsonldSerializer.jsonLdMode=COMPACT
com.inovexcorp.queryservice.jsonldSerializer.optimize=true
com.inovexcorp.queryservice.jsonldSerializer.useNativeTypes=true
com.inovexcorp.queryservice.jsonldSerializer.compactArrays=true

# --- ontology (formerly etc/com.inovexcorp.queryservice.ontology.cfg)
com.inovexcorp.queryservice.ontology.cacheTtlMinutes=${ONTO_CACHE_TTL:60}
com.inovexcorp.queryservice.ontology.cacheMaxEntries=${ONTO_CACHE_MAX_ENTRIES:20}
com.inovexcorp.queryservice.ontology.cacheEnable=${ONTO_CACHE_ENABLED:true}
com.inovexcorp.queryservice.ontology.ontologyQueryTimeout=${ONTO_CACHE_QUERY_TIMEOUT:30}
com.inovexcorp.queryservice.ontology.ontologyMaxResults=${ONTO_CACHE_QUERY_LIMIT:1000}

# --- persistence.encryption (formerly etc/com.inovexcorp.queryservice.persistence.encryption.cfg)
com.inovexcorp.queryservice.persistence.encryption.encryption.enabled=${PASSWORD_ENCRYPTION_ENABLED:false}
com.inovexcorp.queryservice.persistence.encryption.encryption.key=${PASSWORD_ENCRYPTION_KEY:}
com.inovexcorp.queryservice.persistence.encryption.encryption.salt=${PASSWORD_ENCRYPTION_SALT:}
com.inovexcorp.queryservice.persistence.encryption.pbkdf2.iterations=${ENCRYPTION_PBKDF2_ITERATIONS:65536}
com.inovexcorp.queryservice.persistence.encryption.algorithm=${ENCRYPTION_ALGORITHM:AES/GCM/NoPadding}
com.inovexcorp.queryservice.persistence.encryption.key.length=${ENCRYPTION_KEY_LENGTH:256}
com.inovexcorp.queryservice.persistence.encryption.gcm.tag.length=${ENCRYPTION_GCM_TAG_LENGTH:128}
com.inovexcorp.queryservice.persistence.encryption.gcm.iv.length=${ENCRYPTION_GCM_IV_LENGTH:12}
com.inovexcorp.queryservice.persistence.encryption.fail.on.error=${ENCRYPTION_FAIL_ON_ERROR:false}

# --- routebuilder (formerly etc/com.inovexcorp.queryservice.routebuilder.cfg)
com.inovexcorp.queryservice.routebuilder.templateLocation=data/templates/

# --- RoutesController (formerly etc/com.inovexcorp.queryservice.routebuilder.querycontrollers.RoutesController.cfg)
com.inovexcorp.queryservice.routebuilder.querycontrollers.RoutesController.baseUrl=${API_BASE_URL:http://localhost:8888}

# --- CleanHealthRecords (formerly etc/com.inovexcorp.queryservice.scheduler.CleanHealthRecords.cfg)
com.inovexcorp.queryservice.scheduler.CleanHealthRecords.scheduler.expression=0 0 0 * * ?
com.inovexcorp.queryservice.scheduler.CleanHealthRecords.daysToLive=7

# --- CleanMetrics (formerly etc/com.inovexcorp.queryservice.scheduler.CleanMetrics.cfg)
com.inovexcorp.queryservice.scheduler.CleanMetrics.scheduler.expression=0 0/1 * * * ?
com.inovexcorp.queryservice.scheduler.CleanMetrics.minutesToLive=30

# --- CleanSparqiMetrics (formerly etc/com.inovexcorp.queryservice.scheduler.CleanSparqiMetrics.cfg)
com.inovexcorp.queryservice.scheduler.CleanSparqiMetrics.scheduler.expression=0 0 2 * * ?
com.inovexcorp.queryservice.scheduler.CleanSparqiMetrics.daysToLive=7

# --- DatasourceHealthCheck (formerly etc/com.inovexcorp.queryservice.scheduler.DatasourceHealthCheck.cfg)
com.inovexcorp.queryservice.scheduler.DatasourceHealthCheck.enabled=${HEALTH_CHECK_ENABLED:true}
com.inovexcorp.queryservice.scheduler.DatasourceHealthCheck.scheduler.expression=${HEALTH_CHECK_INTERVAL_CRON:0 0/2 * * * ?}
com.inovexcorp.queryservice.scheduler.DatasourceHealthCheck.consecutiveFailureThreshold=${HEALTH_CHECK_FAILURE_THRESHOLD:-1}

# --- QueryMetrics (formerly etc/com.inovexcorp.queryservice.scheduler.QueryMetrics.cfg)
com.inovexcorp.queryservice.scheduler.QueryMetrics.scheduler.expression=0 0/1 * * * ?

# --- sparqi (formerly etc/com.inovexcorp.queryservice.sparqi.cfg)
com.inovexcorp.queryservice.sparqi.llmBaseUrl=${SPARQI_LLM_BASE_URL:}
com.inovexcorp.queryservice.sparqi.llmApiKey=${SPARQI_LLM_API_KEY:}
com.inovexcorp.queryservice.sparqi.llmModelName=${SPARQI_LLM_MODEL:}
com.inovexcorp.queryservice.sparqi.llmTimeout=${SPARQI_LLM_TIMEOUT:90}
com.inovexcorp.queryservice.sparqi.llmTemperature=${SPARQI_LLM_TEMPERATURE:0.7}
com.inovexcorp.queryservice.sparqi.llmMaxTokens=${SPARQI_LLM_MAX_TOKENS:4000}
com.inovexcorp.queryservice.sparqi.sessionTimeoutMinutes=${SPARQI_SESSION_TIMEOUT:60}
com.inovexcorp.queryservice.sparqi.maxConversationHistory=${SPARQI_MAX_CONVO_HISTORY:50}
com.inovexcorp.queryservice.sparqi.enableSparqi=${SPARQI_ENABLED:false}
com.inovexcorp.queryservice.sparqi.systemPromptTemplate=You are SPARQi, a friendly and helpful SPARQL expert who loves to teach. \
You help users develop SPARQL CONSTRUCT queries that use double-curly template parameters (e.g., {{paramName}}).\n\
\n\
Current Route Context:\n\
- Route ID: {{routeId}}\n\
- Description: {{routeDescription}}\n\
- GraphMart URI: {{graphMartUri}}\n\
- Layers: {{layerUris}}\n\
- Ontology Elements Available: {{ontologyElementCount}}\n\
\n\
{{currentTemplateSection}}\
Available Tools:\n\
You have access to ontology lookup tools that let you:\n\
- Search for ontology elements by keywords (lookupOntologyElements)\n\
- Get all classes in the ontology (getAllClasses)\n\
- Get all properties with their domains and ranges (getAllProperties)\n\
- Get individuals/instances to understand data patterns (getIndividuals)\n\
- Get detailed property information (getPropertyDetails)\n\
Use these tools whenever you need to understand what ontology elements are available or find the right classes/properties for a SPARQL query.\n\
\n\
Guidelines:\n\
- Provide clear, concise SPARQL guidance\n\
- Use double-curly syntax for parameters ({{paramName}})\n\
- Focus on CONSTRUCT queries that return JSON-LD\n\
- When users ask about available classes or properties, USE THE TOOLS to get accurate information\n\
- When helping build queries, search the ontology to find relevant concepts\n\
- Reference specific ontology URIs, labels, and relationships from tool results\n\
- Be encouraging and supportive
com.inovexcorp.queryservice.sparqi.metricsEnabled=${SPARQI_METRICS_ENABLED:true}
com.inovexcorp.queryservice.sparqi.inputTokenCostPer1M=${SPARQI_INPUT_TOKEN_COST:2.50}
com.inovexcorp.queryservice.sparqi.outputTokenCostPer1M=${SPARQI_OUTPUT_TOKEN_COST:10.00}
