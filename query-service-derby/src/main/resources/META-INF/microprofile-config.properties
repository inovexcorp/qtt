# Embedded Derby persistence unit (JVM builds only; Derby cannot run in a native image).
# Contributed through this jar so native builds can leave Derby out entirely. Activated at runtime by
# DatabaseKindConfigSource when DB_URL is a jdbc:derby: URL (the default).
quarkus.datasource.derby.db-kind=other
quarkus.datasource.derby.db-version=10.16.1
quarkus.datasource.derby.jdbc.driver=org.apache.derby.jdbc.EmbeddedDriver
quarkus.datasource.derby.jdbc.url=${qtt.db.url}
quarkus.datasource.derby.username=${DB_USER:user}
quarkus.datasource.derby.password=${DB_PASSWORD:password}
quarkus.datasource.derby.jdbc.max-size=10
quarkus.hibernate-orm.derby.datasource=derby
quarkus.hibernate-orm.derby.packages=com.inovexcorp.queryservice.persistence
quarkus.hibernate-orm.derby.dialect=org.hibernate.community.dialect.DerbyDialect
quarkus.hibernate-orm.derby.schema-management.strategy=update
